<!-- Roscap redesign, Track Record deals (10 Nov 2026), new view only. The page footer script copies the 22 CMS cards in, from the two slider lists the old view keeps. -->
<div class="deals" id="deals">
<div class="deal-filter" role="group" aria-label="Filter transactions by region">
<button type="button" class="deal-f" data-f="all" aria-pressed="true">All</button>
<button type="button" class="deal-f" data-f="uk" aria-pressed="false">UK</button>
<button type="button" class="deal-f" data-f="europe" aria-pressed="false">Europe</button>
<button type="button" class="deal-f" data-f="na" aria-pressed="false">North America</button>
</div>
<div class="deal-grid" id="deal-grid" role="list"></div>
<p class="deal-status" aria-live="polite"></p>
<div class="deal-more-wrap"><button type="button" class="button golden deal-more" aria-controls="deal-grid" aria-expanded="false" hidden>View all transactions</button></div>
</div>
