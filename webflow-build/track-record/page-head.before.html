<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
<style>
svg path {
  pointer-events: all;
  cursor: pointer;
}

#svg-map-container,
#svg-map-container svg,

}

}

svg .is-visible {
  opacity: 1;
  pointer-events: auto;
}



</style>
