     Source: prototypes/homepage-track-record-and-rates/HANDOFF.md sections 2.2 and 2.3. The rates panel and the deal list carry their own scripts (Code Embeds). -->
<script>
if (document.documentElement.getAttribute('data-rc-view')==='new') {
/* 1. What We Do (HANDOFF.md 2.3), before Webflow's interactions start at DOMContentLoaded: the photograph goes into a .wwd-media
   frame (its grid id moves with it) and, like the heading, loses its Interactions fade-in, so the new entrance is not doubled.
   The counters carry their real figures (60, 120, 25) for screen readers and reduced motion; the script below counts them up. */
(function () {
  var img = document.querySelector('.section.bg-white img.wwa-image._2');
  if (img) {
    var box = document.createElement('div'); box.className = 'wwd-media';
    if (img.id) { box.id = img.id; img.removeAttribute('id'); }
    img.parentNode.insertBefore(box, img); box.appendChild(img);
    img.removeAttribute('data-w-id'); img.style.removeProperty('opacity');
  }
  var em = document.querySelector('.section.bg-white .grid-content-wrap h2 em[data-w-id]');
  if (em) { em.removeAttribute('data-w-id'); em.style.removeProperty('opacity'); }
  [].slice.call(document.querySelectorAll('.stats-num-span[data-count]')).forEach(function (el) { el.textContent = el.getAttribute('data-count'); });
})();

/* 2. Contact block (HANDOFF.md 2.2): looks the same; hidden labels and autocomplete on the fields, and the desktop Submit
   (a link that clicks the hidden submit) becomes a real submit button tied to the form. */
(function () {
  var cf = document.getElementById('wf-form-Contact-Form');
  if (!cf) return;
  [['name', 'Name', 'name'], ['email', 'Email', 'email'], ['Phone', 'Phone', 'tel'], ['Subject', 'Subject', ''], ['Message', 'Message', '']].forEach(function (f) {
    var el = cf.querySelector('#' + f[0]);
    if (!el) return;
    if (!cf.querySelector('label[for="' + f[0] + '"]')) {
      var l = document.createElement('label'); l.className = 'sr'; l.htmlFor = f[0]; l.textContent = f[1];
      el.parentNode.insertBefore(l, el);
    }
    if (f[2]) el.setAttribute('autocomplete', f[2]);
  });
  var trig = document.querySelector('.contact-button-wrap a[fs-mirrorclick-element="trigger"]');
  if (trig) {
    var b = document.createElement('button');
    b.type = 'submit'; b.setAttribute('form', 'wf-form-Contact-Form'); b.className = trig.className; b.textContent = 'Submit';
    trig.parentNode.replaceChild(b, trig);
  }
})();

/* 3. Reveal fallback for the rates panel and the deal rows (from the prototype's home.js), only where CSS scroll-driven animations are missing */
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  /* ---------- reveal fallback: only where CSS scroll-driven animations are missing ---------- */
  (function revealFallback() {
    var supports = window.CSS && CSS.supports && CSS.supports('animation-timeline: view()');
    if (supports || reduce) return;
    var items = $$('[data-reveal], .dl-item, .rates-panel');
    if (!items.length) return;
    if (!('IntersectionObserver' in window)) { items.forEach(function (el) { el.classList.add('is-vis'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-vis'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    items.forEach(function (el) { io.observe(el); });
  })();
})();

/* 4. What We Do entrance, Asset Classes / Sources of Capital and the counters: handoff code (webflow/what-we-do-slider.html), unchanged */
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* 0. What We Do: the copy comes in once, in reading order, when it reaches the screen (the bg-white section is What We Do on Home). */
  (function () {
    var wrap = document.querySelector('.section.bg-white .two-col-grid .grid-content-wrap');
    if (!wrap || reduce || !('IntersectionObserver' in window)) return;
    wrap.classList.add('wwd-anim');
    var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { wrap.classList.add('is-in'); io.disconnect(); } }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
    io.observe(wrap);
  })();

  /* 1. Asset Classes / Sources of Capital. The arrows loop, the headings switch, a horizontal swipe switches on touch screens.
     The switch: the four cards slide 24 px and fade out while the new four slide in from the other side one after another
     (55 ms apart), so there is never an empty frame; the headings fade, swap and come back as on live. Reduced motion: instant. */
  (function () {
    var box = document.querySelector('.slider-wrap');
    if (!box) return;
    var slides = $$('.swiper-wrapper.is-home > .swiper-slide', box), heads = $$('.slider-heading', box);
    var prev = box.querySelector('.swiper-prev'), next = box.querySelector('.swiper-next');
    if (slides.length < 2 || heads.length < 2) return;
    var names = heads.map(function (h) { return h.textContent.trim(); });
    var idx = 0, busy = false, canAnimate = !reduce && typeof Element.prototype.animate === 'function';
    function setOn(el, on) {
      el.classList.toggle('is-on', on);
      if (on) { el.removeAttribute('aria-hidden'); el.removeAttribute('inert'); } else { el.setAttribute('aria-hidden', 'true'); el.setAttribute('inert', ''); }
    }
    function markHeads(i) { heads.forEach(function (h, k) { h.classList.toggle('is-active', k === i); h.classList.toggle('is-inactive', k !== i); h.setAttribute('aria-pressed', String(k === i)); }); }
    function go(i, dir) {
      i = (i + slides.length) % slides.length;
      if (i === idx || busy) return;
      var from = slides[idx], to = slides[i];
      dir = dir || (i > idx ? 1 : -1);
      if (!canAnimate) { setOn(from, false); setOn(to, true); markHeads(i); idx = i; return; }
      busy = true;
      var outItems = $$('.slider-item', from), inItems = $$('.slider-item', to);
      outItems.forEach(function (el) { el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(' + (-24 * dir) + 'px)' }], { duration: 220, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' }); });
      heads.forEach(function (h) { var act = h.classList.contains('is-active'); h.animate([{ opacity: act ? 1 : 0.55, transform: 'none' }, { opacity: 0, transform: 'translateX(' + (act ? 10 : -10) + '%)' }], { duration: 170, easing: 'ease-in', fill: 'forwards' }); });
      setTimeout(function () {
        setOn(to, true);
        inItems.forEach(function (el, k) { el.animate([{ opacity: 0, transform: 'translateX(' + (32 * dir) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 440, delay: k * 55, easing: 'cubic-bezier(.25,1,.5,1)', fill: 'backwards' }); });
      }, 90);
      setTimeout(function () {
        markHeads(i);
        heads.forEach(function (h) { h.getAnimations().forEach(function (an) { an.cancel(); }); var act = h.classList.contains('is-active'); h.animate([{ opacity: 0, transform: 'translateX(' + (act ? -10 : 10) + '%)' }, { opacity: act ? 1 : 0.55, transform: 'none' }], { duration: 250, easing: 'cubic-bezier(.25,1,.5,1)' }); });
      }, 170);
      setTimeout(function () { setOn(from, false); outItems.forEach(function (el) { el.getAnimations().forEach(function (an) { an.cancel(); }); }); idx = i; busy = false; }, 240);
    }
    function asButton(el, label, fn) {
      el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); if (label) el.setAttribute('aria-label', label);
      el.addEventListener('click', fn);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
    }
    slides.forEach(function (s, k) { s.setAttribute('role', 'group'); s.setAttribute('aria-label', names[k] || ''); setOn(s, k === 0); });
    markHeads(0);
    heads.forEach(function (h, k) {
      asButton(h, null, function () { go(k); });
      h.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault(); var d = e.key === 'ArrowRight' ? 1 : -1, t = (idx + d + heads.length) % heads.length; go(t, d); heads[t].focus();
      });
    });
    if (prev) asButton(prev, 'Previous set', function () { go(idx - 1, -1); });
    if (next) asButton(next, 'Next set', function () { go(idx + 1, 1); });
    var view = box.querySelector('.swiper.is-home') || box, x0 = null, y0 = null;
    view.style.touchAction = 'pan-y';
    view.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; x0 = e.clientX; y0 = e.clientY; });
    view.addEventListener('pointerup', function (e) {
      if (x0 === null) return; var dx = e.clientX - x0, dy = e.clientY - y0; x0 = y0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { var d = dx < 0 ? 1 : -1; go(idx + d, d); }
    });
    view.addEventListener('pointercancel', function () { x0 = y0 = null; });
  })();

  /* 2. Counters, as live (count up once over 2 s when the figures reach 80% of the screen height), with an ease-out instead of
     live's ease-in. Put the real figures (60, 120, 25) in the Designer instead of 0: visitors without JS, search engines and
     screen readers then get the real numbers; the script resets them to 0 just before counting. */
  (function () {
    var els = $$('.stats-num-span[data-count]');
    if (!els.length || reduce || !('IntersectionObserver' in window)) return;
    els.forEach(function (el) {
      var to = Number(el.getAttribute('data-count'));
      if (!isFinite(to)) return;
      var sr = document.createElement('span'); sr.textContent = String(to);
      sr.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap';
      el.parentNode.insertBefore(sr, el); el.setAttribute('aria-hidden', 'true');
      el.textContent = '0';
      var io = new IntersectionObserver(function (es) {
        if (!es[0].isIntersecting) return;
        io.disconnect();
        var t0 = null;
        var step = function (ts) {
          if (t0 === null) t0 = ts;
          var p = Math.min(1, (ts - t0) / 2000), e = 1 - Math.pow(1 - p, 3);
          el.textContent = String(Math.round(to * e));
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }, { rootMargin: '0px 0px -20% 0px' });
      io.observe(el);
    });
  })();
})();

/* 5. What We Do lifecycle (owner's review, 10 Nov 2026): the six stages take the lifecycle style in the page head (.lc), in two
   columns that each stack on their own (1 to 3 and 4 to 6, .lc-col), so a name that runs to two lines never pushes the other
   column's stages apart; --lc-i times the run in reading order. A tap or click on a stage picks it out (pointing does it with a
   mouse, in CSS); a tap on another stage moves it, a second tap clears it. */
(function () {
  var list = document.querySelector('.section.bg-white .two-col-grid .cards-points-wrapper');
  if (!list) return;
  var items = [].slice.call(list.children).filter(function (x) { return x.classList.contains('cards-num-item'); });
  if (!items.length) return;
  list.classList.add('lc');
  var half = Math.ceil(items.length / 2);
  [items.slice(0, half), items.slice(half)].forEach(function (group) {
    if (!group.length) return;
    var col = document.createElement('div'); col.className = 'lc-col';
    group.forEach(function (it) { col.appendChild(it); });
    list.appendChild(col);
  });
  items.forEach(function (it, i) { it.style.setProperty('--lc-i', i); });
  list.addEventListener('click', function (e) {
    var it = e.target.closest('.cards-num-item');
    if (!it || !list.contains(it)) return;
    var was = it.classList.contains('is-on');
    items.forEach(function (x) { x.classList.remove('is-on'); });
    if (!was) it.classList.add('is-on');
  });
})();
}
</script>

<script>
gsap.registerPlugin(ScrollTrigger);
if (document.documentElement.getAttribute('data-rc-view')!=='new') { /* Roscap redesign: old view only; the new view uses the code above */

// COUNTERS (unchanged)
gsap.utils.toArray(".stats-cards-wrap").forEach((card) => {
  const counters = card.querySelectorAll(".stats-num-span");

  ScrollTrigger.create({
    trigger: card,
    start: "top 80%",
    once: true,
    onEnter: () => {
      counters.forEach((counter) => {
        const endValue = +counter.dataset.count;
        const obj = { val: 0 };

        gsap.to(obj, {
          val: endValue,
          duration: 2,
          ease: "circ.in",
          onUpdate: () => {
            counter.textContent = formatNumber(obj.val, 0);
          },
        });
      });
    },
  });
});

function formatNumber(value, decimals) {
  return Math.floor(value).toLocaleString("en-US");
}

// =========================
// SWIPER (LOOP ENABLED)
// =========================
let swiper = new Swiper(".slider-wrap .swiper", {
  spaceBetween: 16,
  loop: true, // ✅ looping enabled
  navigation: {
    nextEl: ".swiper-next",
    prevEl: ".swiper-prev",
  },
});

// =========================
// HEADING SETUP
// =========================
const headingContainer = document.querySelector(".slider-heading-container");
const headings = headingContainer.querySelectorAll(".slider-heading");
// headings[0] = Asset Classes
// headings[1] = Sources of Capital

gsap.set(headings, { xPercent: 0, opacity: 1 });

// =========================
// HEADING TRANSITION
// =========================
function animateHeadingTransition(realIndex) {
  const assetHeading = headings[0];
  const sourcesHeading = headings[1];

  const makeSourcesActive = realIndex === 1;

  const activeHeading   = makeSourcesActive ? sourcesHeading : assetHeading;
  const inactiveHeading = makeSourcesActive ? assetHeading : sourcesHeading;

  const tl = gsap.timeline();

  tl.to([activeHeading, inactiveHeading], {
    xPercent: (i, el) => (el === activeHeading ? 10 : -10),
    opacity: 0,
    duration: 0.2,
    ease: "power2.in",
  })
  .add(() => {
    // swap DOM order so active is first
    headingContainer.insertBefore(activeHeading, inactiveHeading);

    // reset classes
    assetHeading.classList.remove("is-active", "is-inactive");
    sourcesHeading.classList.remove("is-active", "is-inactive");

    // apply new states
    activeHeading.classList.add("is-active");
    inactiveHeading.classList.add("is-inactive");
  })
  .fromTo(
    [activeHeading, inactiveHeading],
    {
      xPercent: (i, el) => (el === activeHeading ? -10 : 10),
      opacity: (i, el) => (el === activeHeading ? 1 : 0.4),
    },
    {
      xPercent: 0,
      opacity: (i, el) => (el === activeHeading ? 1 : 0.4),
      duration: 0.25,
      ease: "power2.out",
    }
  );
}

// =========================
// CLICK HEADING → LOOPED SLIDE
// =========================
headings.forEach((heading, index) => {
  heading.addEventListener("click", () => {
    swiper.slideToLoop(index); // ✅ loop-safe navigation
  });
});

// =========================
// SYNC ON SLIDE CHANGE
// =========================
let lastIndex = swiper.realIndex;

swiper.on("slideChange", function () {
  if (this.realIndex === lastIndex) return; // guard against loop duplicates
  lastIndex = this.realIndex;
  animateHeadingTransition(this.realIndex);
});

// =========================
// INITIAL STATE
// =========================
headings[0].classList.add("is-active");
headings[1].classList.add("is-inactive");

gsap.set(headings[0], { opacity: 1 });
gsap.set(headings[1], { opacity: 0.4 });

}
</script>


<!-- Rates widget: reads the twice-daily feed published from github.com/edusancheez2005/roscap-rates
     (sources: Federal Reserve via FRED, Bank of England, Euribor 3-month daily fixing).
     Writes into the cards with ids baserate-* / changerate-*, explains each change figure in a hover
     tooltip, and adds a small right-aligned "Updated <date>" line under the cards. -->
<script>
if (document.documentElement.getAttribute('data-rc-view')!=='new') { /* Roscap redesign: old view only; the new rates panel has its own script */
document.addEventListener("DOMContentLoaded", () => {
  const FEED = "https://edusancheez2005.github.io/roscap-rates/rates.json";
  const longDate = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  };
  fetch(FEED, { cache: "no-store" })
    .then(res => res.json())
    .then(data => {
      const render = (key) => {
        const baseEl   = document.getElementById(`baserate-${key}`);
        const changeEl = document.getElementById(`changerate-${key}`);
        const rate     = data.rates && data.rates[key];
        if (!baseEl || !changeEl || !rate) return;

        baseEl.textContent   = rate.display;          // "3.75% - 4.00%", "3.75%", "2.642%"
        changeEl.textContent = rate.change_display;   // "+0.25%", "-0.25%", "+0.006%"

        changeEl.classList.remove("up", "down", "flat");
        changeEl.classList.add(rate.change > 0 ? "up" : rate.change < 0 ? "down" : "flat");

        const when = rate.changed_on ? longDate(rate.changed_on) : "";
        changeEl.title = key === "euribor"
          ? "Change since the previous daily fixing" + (when ? " (" + when + ")" : "")
          : "Change at the last " + (key === "fed" ? "Federal Reserve" : "Bank of England") + " decision" + (when ? " (" + when + ")" : "");
        baseEl.title = rate.source || "";
      };
      ["boe", "fed", "euribor"].forEach(render);

      if (!data.updated_display) return;
      let note = document.getElementById("rates-updated");
      if (!note) {
        const wrap = document.querySelector(".baserate-cards-wrap");
        if (!wrap) return;
        note = document.createElement("p");
        note.id = "rates-updated";
        note.className = "text-size-tiny text-color-secondary text-align-right";
        note.style.margin = "10px auto 0";
        const fit = () => { note.style.width = Math.round(wrap.getBoundingClientRect().width) + "px"; };
        fit();
        window.addEventListener("resize", fit);
        wrap.insertAdjacentElement("afterend", note);
      }
      note.textContent = "Updated " + data.updated_display;
    })
    .catch(err => console.error("Rates feed failed:", err));
});
}
</script>
