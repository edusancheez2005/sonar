<!-- Roscap Home hero: keep the panther video on every screen size, make it light.
     The hero design stays exactly as live (copy bottom-left, no overlay). What changes is underneath:
       - the 6.8 MB S3 file is replaced by two encodes of the same clip:
           hero-desktop.mp4   1280 x 958, 1.4 MB  (sharper than the 962 x 720 copy Webflow holds today)
           hero-portrait.mp4   576 x 1078, 0.7 MB (phones in portrait; cropped on the panther so both eyes stay in frame)
       - the hero shows the frame the video starts on (1.0 s) on teal, so the white copy is never shown on cream
       - a pause button (WCAG 2.2.2), the video pauses when scrolled away, and a close-up still replaces it under
         reduced motion, Save-Data, or when the browser refuses autoplay (for example iOS Low Power Mode)
     Files are in prototypes/homepage-track-record-and-rates/media/. Replace HOST below with where they are served from.
     The MP4s can go where the current one lives (the roscap S3 bucket); set Content-Type video/mp4 and
     Cache-Control "public, max-age=31536000, immutable" on upload (the current S3 file has no cache header).
     The four WebP stills can be uploaded to Webflow Assets instead if preferred.
     Also delete the hidden Webflow Background Video element in the hero (.hero-bg.hide.w-background-video):
     it is display:none but still downloads its 1.5 MB copy of the clip on every visit. -->

<!-- PART A. Page settings (Home) > Custom code > Inside <head> tag -->
<link rel="preload" as="image" href="HOST/hero-start-portrait.webp" media="(max-width: 767px) and (orientation: portrait)" fetchpriority="high">
<link rel="preload" as="image" href="HOST/hero-start-1440.webp" media="not all and (max-width: 767px) and (orientation: portrait)" fetchpriority="high">
<style>
/* isolation creates a stacking context: without it the video layer (.hero-bg, z-index -1) would sit behind the new
   section background and disappear */
.section.is-heroheader{isolation:isolate;background:#043435 url(HOST/hero-start-1440.webp) 50% 50%/cover no-repeat}
.section.is-heroheader.is-still{background-image:url(HOST/hero-still-1440.webp)}
@media (max-width:767px) and (orientation:portrait){
  .section.is-heroheader{background-image:url(HOST/hero-start-portrait.webp)}
  .section.is-heroheader.is-still{background-image:url(HOST/hero-still-portrait.webp)}
}
.hero-bg .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.hero-bg .hero-video.is-playing{opacity:1}
.hero-pause{position:absolute;right:max(16px,calc((100% - 1380px) / 2 + 36px));bottom:78px;z-index:11;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(2,37,38,.35);color:#fff;cursor:pointer;transition:background-color .2s,border-color .2s}
.hero-pause:hover{background:rgba(2,37,38,.6);border-color:#fff}
.hero-pause:focus-visible{outline:2px solid #E1C979;outline-offset:3px}
.hero-pause[hidden]{display:none}
.hero-pause svg{width:14px;height:14px;fill:currentColor}
.hero-pause .i-play,.hero-pause[aria-pressed="true"] .i-pause{display:none}
.hero-pause[aria-pressed="true"] .i-play{display:block}
@media (max-width:767px){.hero-pause{right:16px}}
@media (prefers-reduced-motion:reduce){.hero-bg .hero-video{transition:none}}
</style>

<!-- PART B. The existing Embed inside the hero (.hero-bg.w-embed): replace the current
     <video ... src="https://roscap.s3.us-east-1.amazonaws.com/Roscap+Video++(1).mp4#t=1"> tag with this.
     No autoplay attribute and no src: the script in part D picks the right file and starts it at 1.0 s. -->
<video class="hero-video" id="hero-video" muted loop playsinline preload="none" poster="HOST/hero-start-1440.webp" data-start="1" aria-hidden="true" tabindex="-1">
  <source data-src="HOST/hero-portrait.mp4" type="video/mp4" media="(max-width: 767px) and (orientation: portrait)">
  <source data-src="HOST/hero-desktop.mp4" type="video/mp4">
</video>

<!-- PART C. A new Embed placed directly inside section.is-heroheader (next to the container, not inside .hero-bg) -->
<button class="hero-pause" id="hero-pause" type="button" aria-pressed="false" aria-label="Pause background video" hidden>
  <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z"/></svg>
  <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z"/></svg>
</button>

<!-- PART D. Page settings (Home) > Custom code > Before </body> tag -->
<script>
(function () {
  var hero = document.querySelector('.section.is-heroheader'), v = document.getElementById('hero-video'), btn = document.getElementById('hero-pause');
  if (!hero || !v) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function still() { hero.classList.add('is-still'); if (v.parentNode) v.parentNode.removeChild(v); if (btn) btn.hidden = true; }
  if (reduce || (navigator.connection && navigator.connection.saveData)) { still(); return; }
  var portrait = window.matchMedia('(max-width: 767px) and (orientation: portrait)').matches;
  var startAt = parseFloat(v.getAttribute('data-start')) || 0, userPaused = false;
  function play() { var p = v.play(); if (p && p.catch) p.catch(function (e) { if (e && e.name === 'NotAllowedError') still(); }); }
  function begin() {
    var chosen = v.querySelector(portrait ? 'source[media]' : 'source:not([media])');
    Array.prototype.slice.call(v.querySelectorAll('source')).forEach(function (s) { if (s !== chosen) v.removeChild(s); });
    if (!chosen) { still(); return; }
    chosen.removeAttribute('media');
    chosen.src = chosen.getAttribute('data-src');
    v.addEventListener('loadedmetadata', function () { if (startAt && v.currentTime < startAt) { try { v.currentTime = startAt; } catch (e) {} } }, { once: true });
    v.addEventListener('playing', function () { v.classList.add('is-playing'); if (btn) btn.hidden = false; }, { once: true });
    v.load();
    play();
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { if (!es[0].isIntersecting) v.pause(); else if (!userPaused && v.parentNode) play(); }).observe(hero);
    }
    if (btn) btn.addEventListener('click', function () {
      userPaused = !userPaused;
      btn.setAttribute('aria-pressed', String(userPaused));
      if (userPaused) v.pause(); else play();
    });
  }
  requestAnimationFrame(function () { setTimeout(begin, 0); });
})();
</script>
