<div class="fp" id="footprint">
<div class="fp-map" data-img="https://cdn.prod.website-files.com/693e84a885fe6122f0427916/REPLACE-WITH-UPLOADED-footprint-map.svg">
<noscript><img class="fp-svg" src="https://cdn.prod.website-files.com/693e84a885fe6122f0427916/REPLACE-WITH-UPLOADED-footprint-map.svg" width="1389" height="606" alt=""></noscript>
<div class="fp-pop" aria-hidden="true"><span class="fp-pop-k">Deals</span><span class="fp-pop-v"></span></div>
</div>
<ul class="fp-list" aria-label="Transactions by country"><li><button class="fp-chip" type="button" data-c="uk" data-n="52" aria-pressed="false"><span class="fp-chip-c">United Kingdom</span><span class="fp-chip-n">52 deals</span></button></li><li><button class="fp-chip" type="button" data-c="ireland" data-n="2" aria-pressed="false"><span class="fp-chip-c">Ireland</span><span class="fp-chip-n">2 deals</span></button></li><li><button class="fp-chip" type="button" data-c="france" data-n="2" aria-pressed="false"><span class="fp-chip-c">France</span><span class="fp-chip-n">2 deals</span></button></li><li><button class="fp-chip" type="button" data-c="spain" data-n="1" aria-pressed="false"><span class="fp-chip-c">Spain</span><span class="fp-chip-n">1 deal</span></button></li><li><button class="fp-chip" type="button" data-c="italy" data-n="2" aria-pressed="false"><span class="fp-chip-c">Italy</span><span class="fp-chip-n">2 deals</span></button></li><li><button class="fp-chip" type="button" data-c="albania" data-n="1" aria-pressed="false"><span class="fp-chip-c">Albania</span><span class="fp-chip-n">1 deal</span></button></li><li><button class="fp-chip" type="button" data-c="usa" data-n="1" aria-pressed="false"><span class="fp-chip-c">USA</span><span class="fp-chip-n">1 deal</span></button></li></ul>
</div>
<script>
(function(){var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;var hasIO='IntersectionObserver' in window;var $=function(s,r){return(r||document).querySelector(s)};var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var fp = document.getElementById('footprint');
  if (fp) (function () {
    var box = $('.fp-map', fp), pop = $('.fp-pop', fp), popV = $('.fp-pop-v', fp);
    var chips = $$('.fp-chip', fp);
    var ORDER = chips.map(function (c) { return c.getAttribute('data-c'); }); /* the list order is the entrance order */
    var STEP = 150, ATLANTIC = 250;  /* ms between countries; the USA waits a little longer, it is across the Atlantic */
    var svg = null, W = 1389, H = 606, pins = {}, on = null, pinned = null, started = false;
    var chipOf = function (c) { return $('.fp-chip[data-c="' + c + '"]', fp); };

    function show(c) {
      if (c === on) return;
      on = c;
      $$('.is-on', fp).forEach(function (el) { if (el !== pop) el.classList.remove('is-on'); });
      fp.classList.toggle('has-on', !!c);
      if (!c) { pop.classList.remove('is-on'); return; }
      $$('[data-c="' + c + '"]', fp).forEach(function (el) { el.classList.add('is-on'); });
      var p = pins[c];
      if (!p) return;
      var glide = pop.classList.contains('is-on');
      pop.classList.toggle('no-glide', !glide); /* first appearance: rise in place; afterwards glide between countries */
      pop.style.left = (p.x / W * 100) + '%';
      pop.style.top = (p.top / H * 100) + '%';
      popV.textContent = chipOf(c).getAttribute('data-n');
      void pop.offsetWidth;
      pop.classList.add('is-on');
    }
    function pin(c) {
      pinned = c;
      chips.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-c') === c)); });
      show(c);
    }
    function start() {
      if (started) return;
      started = true;
      requestAnimationFrame(function () { requestAnimationFrame(function () { fp.classList.add('is-in'); }); });
      var total = (ORDER.length - 1) * STEP + ATLANTIC + 1500;
      setTimeout(function () { fp.classList.add('fp-done'); }, total);
    }

    /* the list works on its own (keyboard, touch, mouse), with or without the map */
    chips.forEach(function (b) {
      var c = b.getAttribute('data-c');
      b.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') show(c); });
      b.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') show(pinned); });
      b.addEventListener('focus', function () { start(); show(c); });
      b.addEventListener('blur', function () { show(pinned); });
      b.addEventListener('click', function (e) {
        pin(pinned === c ? null : c);
        /* unpinned with the keyboard or the mouse: the country stays shown while the chip has focus or the pointer */
        if (pinned === null && (e.detail === 0 || e.pointerType === 'mouse')) show(c);
      });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (pinned || on)) { pin(null); } });

    function setup() {
      var vb = svg.viewBox && svg.viewBox.baseVal;
      if (vb && vb.width) { W = vb.width; H = vb.height; }
      $$('.fp-pin', svg).forEach(function (g) {
        pins[g.getAttribute('data-c')] = { x: +g.getAttribute('data-x'), top: +g.getAttribute('data-top') };
      });
      ORDER.forEach(function (c, i) {
        var d = (i * STEP + (c === 'usa' ? ATLANTIC : 0)) + 'ms';
        $$('[data-c="' + c + '"]', fp).forEach(function (el) { el.style.setProperty('--d', d); });
      });
      /* hover and tap on the map itself */
      svg.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        var g = e.target.closest ? e.target.closest('[data-c]') : null; /* a country, its label or its pin */
        show(g ? g.getAttribute('data-c') : pinned);
      });
      svg.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') show(pinned); });
      svg.addEventListener('click', function (e) {
        var g = e.target.closest ? e.target.closest('[data-c]') : null;
        var c = g ? g.getAttribute('data-c') : null;
        pin(c && c !== pinned ? c : null);
      });
      /* entrance: armed only when motion is allowed; plays once when a third of the map is on screen
         (or straight away if the visitor has already scrolled past it) */
      if (!reduce && hasIO) {
        fp.classList.add('fp-armed');
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if ((e.isIntersecting && e.intersectionRatio >= 0.33) || e.boundingClientRect.bottom < 0) { io.disconnect(); start(); }
          });
        }, { threshold: [0, 0.33, 0.66] });
        io.observe(box);
      }
    }
    function fallback(url) {
      var img = new Image();
      img.className = 'fp-svg'; img.alt = ''; img.width = 1389; img.height = 606; img.src = url;
      box.insertBefore(img, box.firstChild);
    }
    function load() {
      var url = box.getAttribute('data-img');
      if (!url) return;
      if (!window.fetch) { fallback(url); return; }
      fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (txt) {
        var holder = document.createElement('div');
        holder.innerHTML = txt;
        svg = holder.querySelector('svg');
        if (!svg) throw new Error('no svg');
        box.insertBefore(svg, box.firstChild);
        setup();
      }).catch(function () { fallback(url); });
    }
    /* fetch the map when it is near (about a screen away), not with the page */
    if (hasIO) {
      var near = new IntersectionObserver(function (entries) {
        if (entries.some(function (e) { return e.isIntersecting; })) { near.disconnect(); load(); }
      }, { rootMargin: '900px 0px' });
      near.observe(box);
    } else load();
  })();
})();
</script>
