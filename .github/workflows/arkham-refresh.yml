# Arkham data refresh — runs OUTSIDE Vercel on purpose.
#
# Arkham's WAF tarpits Vercel egress IPs (observed 2026-07-26: every
# fetch from prod hangs to timeout while the same calls succeed from
# anywhere else). lib/arkham/client.ts serves FRESH arkham_cache rows
# before attempting any outbound call, so refreshing the cache from
# GitHub Actions keeps figure-page portfolio charts, entity
# counterparties and token top-holders live with zero Vercel→Arkham
# traffic. The label harvest (the trial's scarce label-lookup spend)
# runs here too, on the 1st/10th/20th.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ARKHAM_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: arkham-refresh

on:
  schedule:
    - cron: '30 4 * * *'   # daily cache refresh, 04:30 UTC
  workflow_dispatch:
    inputs:
      harvest:
        description: 'Also run the label harvest now'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight — verify repo Actions secrets exist
        run: |
          missing=""
          [ -z "$ARKHAM_API_KEY" ] && missing="$missing ARKHAM_API_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo Actions secrets:$missing — add them (exact names) at github.com/edusancheez2005/sonar/settings/secrets/actions"
            exit 1
          fi
          echo "all three secrets present"
      - name: Refresh arkham_cache (history, counterparties, holders)
        run: python3 scripts/arkham-cache-refresh.py
      - name: Verify freshness actually advanced (public endpoint)
        run: |
          # The refresh script could exit 0 while writes silently failed;
          # this independent check makes such a run fail loudly. Compares
          # the site's public freshness timestamp to the job start time.
          FRESH=$(curl -s -m 30 https://www.sonartracker.io/api/arkham/health | python3 -c "import json,sys; print(json.load(sys.stdin)['cache_freshness']['entity_history'] or '')")
          echo "entity_history freshness: $FRESH  (job started: $JOB_START)"
          python3 - "$FRESH" <<'EOF'
          import sys, datetime
          fresh = sys.argv[1]
          if not fresh:
              print("::error::freshness endpoint returned no timestamp"); sys.exit(1)
          ts = datetime.datetime.fromisoformat(fresh.replace("Z", "+00:00"))
          age = (datetime.datetime.now(datetime.timezone.utc) - ts).total_seconds()
          if age > 3600:
              print(f"::error::entity_history cache is {age/3600:.1f}h old — this run refreshed nothing")
              sys.exit(1)
          print(f"freshness OK ({age/60:.0f} min old)")
          EOF
      - name: Label harvest (1st/5th/10th/15th/20th, or manual with harvest=true)
        run: |
          DAY=$(date -u +%d)
          case "$DAY" in
            01|05|10|15|20) HARVEST=1 ;;
            *) HARVEST=0 ;;
          esac
          if [ "$HARVEST" = "1" ] || [ "${{ inputs.harvest }}" = "true" ]; then
            python3 scripts/arkham-label-harvest.py
          else
            echo "not a harvest day (day=$DAY) — skipping"
          fi
