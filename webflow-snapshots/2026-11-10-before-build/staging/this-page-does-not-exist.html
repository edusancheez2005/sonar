/a></div></div><script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=693e84a885fe6122f0427916" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/693e84a885fe6122f0427916/js/webflow.schunk.f2efb3c5440a81cf.js" type="text/javascript" integrity="sha384-VK02VJvMib7ytrF5M2joPWNtDQs366FZgEQ5B+Iwnjx0WBnwQXfootyziSYxdrmS" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/693e84a885fe6122f0427916/js/webflow.schunk.e24cca2f96656830.js" type="text/javascript" integrity="sha384-6UhBTwBvUyj9ImznL8xpdMMJ7e1N25g8QkGbMmKmWex34gg76f1flhRjilOVgWCv" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/693e84a885fe6122f0427916/js/webflow.3096ed60.444d7af10a4d8f5d.js" type="text/javascript" integrity="sha384-VcOwSOFs3x/7L4sPdsaXha7pezH3bedJmdi990LZ1aTv7w1Z+FUDqr5hyf/Sb7ng" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js" type="text/javascript"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/SplitText.min.js" type="text/javascript"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/TextPlugin.min.js" type="text/javascript"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollTrigger.min.js" type="text/javascript"></script><script type="text/javascript">gsap.registerPlugin(SplitText,TextPlugin,ScrollTrigger);</script><script>
  document.addEventListener("DOMContentLoaded", function () {
    const navMenu = document.querySelector(".nav_menu_2");
    const navbar = document.querySelector(".navbar");

    if (!navMenu || !navbar) return;

    navMenu.style.transition = "opacity 0.3s ease-in-out";

    let lastScrollY = window.scrollY;
    const SCROLL_THRESHOLD = window.innerHeight * 0.8;
    const MOBILE_BREAKPOINT = 767;

    /* ---------------------------------
       Pages that allow scroll-based bg
    ---------------------------------- */
    const MOBILE_BG_SLUGS = [
      "/",
      "/about-us",
      "/our-services",
      "/track-record",
      "/partner-program",
      "/insights",
      "/contact-us",
      "/contact-us-success",
      "compliance-governance"
    ];

    const normalizePath = (path) =>
      path.replace(/\/$/, "") || "/";

    const currentPath = normalizePath(window.location.pathname);
    const allowScrollBg = MOBILE_BG_SLUGS.includes(currentPath);

    // 🔒 Pages NOT in list are locked green everywhere
    const isLockedGreenPage = !allowScrollBg;

    /* ---------------------------------
       INITIAL STATE
    ---------------------------------- */
    if (isLockedGreenPage) {
      navbar.classList.add("is-scrolled");
    }

    window.addEventListener("scroll", function () {
      const currentScrollY = window.scrollY;
      const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;

      /* -------------------------
         Hide / Show on scroll
         (DESKTOP ONLY)
      -------------------------- */
      if (!isMobile) {
        if (currentScrollY > lastScrollY) {
          navMenu.style.opacity = "0";
          navMenu.style.pointerEvents = "none";
        } else {
          navMenu.style.opacity = "1";
          navMenu.style.pointerEvents = "auto";
        }
      }

      /* -------------------------
         Background logic
      -------------------------- */

      // 🔒 Locked pages → always green
      if (isLockedGreenPage) {
        navbar.classList.add("is-scrolled");
      }

      // 🎯 Scroll-based pages → toggle on scroll
      else {
        if (currentScrollY >= SCROLL_THRESHOLD) {
          navbar.classList.add("is-scrolled");
        } else {
          navbar.classList.remove("is-scrolled");
        }
      }

      lastScrollY = currentScrollY;
    });

    /* -------------------------
       Handle resize
    -------------------------- */
    window.addEventListener("resize", () => {
      const isMobile = window.innerWidth <= MOBILE_BREAKPOINT;

      if (isMobile) {
        navMenu.style.opacity = "1";
        navMenu.style.pointerEvents = "auto";
      }

      if (isLockedGreenPage) {
        navbar.classList.add("is-scrolled");
      }
    });
  });
</script>
</body></html>
